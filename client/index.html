<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta name="theme-color" content="#f4f0e8" />
    <meta
      name="description"
      content="โค้ดดิ้งเมืองสามหมอก — สตูดิโอดิจิทัลจากแม่ฮ่องสอน รับทำเว็บไซต์ ระบบซอฟต์แวร์ และคลาวด์ คุยง่าย เห็นภาพก่อนเริ่ม ดูแลต่อได้จริง"
    />
    <title>โค้ดดิ้งเมืองสามหมอก — รับทำเว็บไซต์ครบวงจร</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chonburi&family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script type="module">
      const analyticsEndpoint = "%VITE_ANALYTICS_ENDPOINT%";
      const analyticsWebsiteId = "%VITE_ANALYTICS_WEBSITE_ID%";
      if (
        analyticsEndpoint.startsWith("http") &&
        analyticsWebsiteId &&
        !analyticsEndpoint.includes("%") &&
        !analyticsWebsiteId.includes("%")
      ) {
        const analyticsScript = document.createElement("script");
        analyticsScript.defer = true;
        analyticsScript.src = `${analyticsEndpoint.replace(/\/$/, "")}/umami`;
        analyticsScript.dataset.websiteId = analyticsWebsiteId;
        document.head.appendChild(analyticsScript);
      }
    </script>
  </body>
</html>
