<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF & Document Tools Suite - รวมเครื่องมือจัดการเอกสารครบวงจร</title>
  <link rel="stylesheet" href="tools/css/tools.css">
</head>
<body>

  <!-- Header -->
  <header>
    <div class="header-container">
      <a href="#" class="brand">
        <div class="brand-logo">P</div>
        <span class="brand-name">DocuTools Suite</span>
      </a>

      <div class="search-box">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="search-input" class="search-input" placeholder="ค้นหาเครื่องมือ เช่น Merge, Convert, OCR, AI...">
      </div>

      <div class="header-actions">
        <!-- Language Switcher -->
        <div class="lang-switch" id="lang-switch" title="Language / ภาษา">
          <button class="lang-btn active" data-lang="th">🇹🇭 TH</button>
          <button class="lang-btn" data-lang="en">🇬🇧 EN</button>
        </div>

        <button class="btn-theme" id="btn-theme-toggle" title="สลับโหมดมืด/สว่าง">🌙</button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main>
    <div class="hero-section">
      <h1 class="hero-title" data-i18n="hero_title">ทุกเครื่องมือสำหรับจัดการไฟล์ PDF & เอกสาร</h1>
      <p class="hero-subtitle" data-i18n="hero_subtitle">แปลงไฟล์, รวมไฟล์, แยกหน้า, บีบอัด, เซ็นชื่อ, แก้ไข และฟีเจอร์ AI ครบครันในที่เดียว</p>
    </div>

    <!-- Category Tabs -->
    <div class="filter-tabs" id="filter-tabs">
      <button class="tab-btn active" data-category="all"><span data-i18n="tab_all">ทั้งหมด</span> <span id="total-tools-count">(31)</span></button>
      <button class="tab-btn" data-category="convert-to" data-i18n="tab_convert_to">แปลงเป็น PDF</button>
      <button class="tab-btn" data-category="convert-from" data-i18n="tab_convert_from">แปลงจาก PDF</button>
      <button class="tab-btn" data-category="organize" data-i18n="tab_organize">จัดหน้า & แก้ไข</button>
      <button class="tab-btn" data-category="security" data-i18n="tab_security">ความปลอดภัย</button>
      <button class="tab-btn" data-category="ai" data-i18n="tab_ai">AI & ขั้นสูง</button>
    </div>

    <!-- 31 Tools Grid (Rendered dynamically via tools-data.js) -->
    <div class="tools-grid" id="tools-grid"></div>
  </main>

  <!-- Interactive Action Modal -->
  <div class="modal-overlay" id="tool-modal">
    <div class="modal-content">
      <button class="modal-close" id="btn-modal-close">✕</button>
      <div class="modal-header">
        <div id="modal-icon-container"></div>
        <div>
          <h2 id="modal-tool-title" style="font-size:1.3rem; font-weight:800;">Tool Title</h2>
          <p id="modal-tool-desc" style="font-size:0.85rem; color:var(--text-desc);">Description</p>
        </div>
      </div>

      <div class="dropzone" id="dropzone">
        <div class="dropzone-icon">📄</div>
        <h4 id="dropzone-title" data-i18n="dropzone_title" style="font-weight:700; margin-bottom:4px;">ลากไฟล์มาวางที่นี่ หรือคลิกเพื่อเลือกไฟล์</h4>
        <p id="dropzone-desc" data-i18n="dropzone_desc" style="font-size:0.8rem; color:var(--text-muted);">รองรับไฟล์ PDF, Word, Excel, Images (สูงสุด 100 MB)</p>
        <input type="file" id="file-input" style="display:none;" />
      </div>

      <button class="btn-action-primary" id="btn-start-process" data-i18n="btn_start_process">เริ่มประมวลผลทันที ⚡</button>
    </div>
  </div>

  <div class="toast" id="toast-msg"></div>

  <!-- Modular Scripts -->
  <script src="tools/js/tools-data.js"></script>
  <script src="tools/js/tools-app.js"></script>
</body>
</html>
